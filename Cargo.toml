[package]
name = "badge-farm"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
discord_client_gateway = { git = "https://github.com/prismillon/discord-client-rs", rev = "6d9f537ccc8ed6ec480cd3887d8418ceab8778d5" }
discord_client_rest = { git = "https://github.com/prismillon/discord-client-rs", rev = "6d9f537ccc8ed6ec480cd3887d8418ceab8778d5" }
discord_client_structs = { git = "https://github.com/prismillon/discord-client-rs", rev = "6d9f537ccc8ed6ec480cd3887d8418ceab8778d5" }
tokio = { version = "1.45.0", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
serde_json = "1.0.140"
indicatif = "0.18.6"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography"] }

[patch.crates-io]
wreq = { git = "https://github.com/0x676e67/wreq", rev = "cd76bcdf1307153de289d34e072528bdf0510a3b" }
btls = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
